name: Sincronizar partidos FCP
on:
  schedule:
    - cron: "15 7 * * *"   # 1 vez al día: 8:15 en invierno, 9:15 en verano (hora de Mataró)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sync_partidos.py
      - name: Commit si hay cambios
        run: |
          if git diff --quiet partidos.json; then echo "Sin cambios"; exit 0; fi
          git config user.name "fcp-sync"
          git config user.email "actions@users.noreply.github.com"
          git add partidos.json
          git commit -m "Partidos FCP $(date -u +%Y-%m-%d)"
          git push
